<body class="bg-gray-50 text-gray-900">
    <nav class="p-6 bg-white shadow-sm flex justify-between items-center">
        <div class="text-2xl font-bold text-blue-700"><a href="index.html">OmniSync Data</a></div>
        <div class="space-x-6 text-sm font-medium">

        </div>

    <section class="max-w-4xl mx-auto py-16 px-4">
        <h1 class="text-3xl font-bold mb-8">隐私政策</h1>
        <div class="prose text-gray-700 space-y-4">
            <p><strong>生效日期：</strong> 2026年3月</p>
            <p>OmniSync Data 非常重视您的隐私。本政策说明了我们如何收集、使用和保护您的信息。</p>
            <h3 class="text-xl font-bold mt-6">1. 信息收集</h3>
            <p>我们仅收集提供服务所必需的业务信息及技术日志数据。</p>
            <h3 class="text-xl font-bold mt-6">2. 数据安全</h3>
            <p>我们采用行业标准的加密技术（如 HTTPS 和 TLS）保护数据在传输和存储过程中的安全。</p>
            <h3 class="text-xl font-bold mt-6">3. 数据不出售</h3>
            <p>我们承诺不会将您的任何业务数据或个人信息出售给第三方机构。</p>
        </div>
    </section>
