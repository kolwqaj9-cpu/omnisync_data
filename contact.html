<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - OmniSync Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="p-6 bg-white shadow-sm flex justify-between items-center">
        <div class="text-2xl font-bold text-blue-700"><a href="index.html">OmniSync Data</a></div>
        <div class="space-x-6 text-sm font-medium">
            <a href="index.html" class="hover:text-blue-600">首页</a>
            <a href="features.html" class="hover:text-blue-600">功能特性</a>
            <a href="pricing.html" class="hover:text-blue-600">产品定价</a>
            <a href="about.html" class="hover:text-blue-600">关于我们</a>
            <a href="contact.html" class="text-blue-600">联系我们</a>
        </div>
    </nav>
    <section class="max-w-xl mx-auto py-16 px-4">
        <h2 class="text-3xl font-bold mb-8 text-center">与我们取得联系</h2>
        <form class="bg-white p-8 rounded-lg shadow space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                <input type="text" class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">工作邮箱</label>
                <input type="email" class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">需求描述</label>
                <textarea rows="4" class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <button type="button" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700">发送消息</button>
        </form>
    </section>
</body>
</html>
